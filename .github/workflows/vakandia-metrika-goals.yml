name: Вакандия — цели Метрики

# Создаёт недостающие JS-цели в счётчике Вакандии (112539872) по списку
# scripts/metrika/vakandia/goals.json. Только ручной запуск; по умолчанию —
# план без записи. Цели Этикетки этот сценарий не трогает.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = только план, 0 = создать недостающие цели'
        required: false
        default: '1'
  # Временно (02.11.2026): запись при отправке этой ветки — без входа в GitHub в браузере.
  # Только эта ветка; ручной запуск по-прежнему по умолчанию строит план без записи.
  push:
    branches: [claude/vakandia-goals-1102]
    paths: [scripts/metrika/vakandia/goals.json, .github/workflows/vakandia-metrika-goals.yml]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync Vakandia goals
        env:
          METRIKA_OAUTH_TOKEN: ${{ secrets.METRIKA_OAUTH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'push' && '0' || inputs.dry_run }}
        run: node scripts/metrika/vakandia/sync-goals.mjs
