name: Контент — автопилот

# Пишет месячную норму статей и прогоняет hero-картинки одним пакетом.
# Публикует не этот workflow, а auto-publish.yml: он выпускает по одному
# черновику в день, указанный в pubDate.
#
# Расписание:
#   1-го числа  — месячная норма (QUOTA статей на будние дни месяца)
#   понедельник — дозаправка, если запас публикаций просел ниже 10 дней

on:
  schedule:
    - cron: '0 1 1 * *'   # 1-го числа, 04:00 МСК
    - cron: '0 1 * * 1'   # понедельник, 04:00 МСК
  workflow_dispatch:
    inputs:
      count:
        description: 'Сколько статей написать (пусто = по будним дням месяца, не больше квоты)'
        required: false
        default: ''
      start_date:
        description: 'С какой даты расставлять pubDate (YYYY-MM-DD, пусто = завтра)'
        required: false
        default: ''
      skip_images:
        description: 'Не генерировать картинки (1 = да)'
        required: false
        default: '0'
      dry_run:
        description: 'Показать план прогона без обращений к API (1 = да)'
        required: false
        default: '0'

concurrency:
  group: content-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      QUOTA: '22'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Состояние очереди
        id: queue
        run: |
          node scripts/content/queue-status.mjs
          echo "json=$(node scripts/content/queue-status.mjs --json | tr -d '\n')" >> $GITHUB_OUTPUT

      - name: Сколько статей писать
        id: plan
        run: |
          RUNWAY=$(echo '${{ steps.queue.outputs.json }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).runwayDays))")
          DRAFTS=$(echo '${{ steps.queue.outputs.json }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).drafts))")
          COUNT=""

          if [ -n "${{ inputs.count }}" ]; then
            COUNT="${{ inputs.count }}"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 1" ]; then
            # Понедельничная дозаправка: работаем только когда запас просел.
            if [ "$RUNWAY" -ge 10 ]; then
              echo "Запас публикаций $RUNWAY дн. — дозаправка не нужна."
              echo "skip=1" >> $GITHUB_OUTPUT
              exit 0
            fi
            COUNT=$(( QUOTA - DRAFTS ))
            [ "$COUNT" -lt 1 ] && COUNT=1
          fi

          echo "skip=0" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Пишем статей: ${COUNT:-по будним дням месяца}"

      - name: Генерация черновиков
        if: steps.plan.outputs.skip != '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COUNT: ${{ steps.plan.outputs.count }}
          START_DATE: ${{ inputs.start_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          # По одной статье за раз: OpenRouter резервирует максимальную
          # стоимость каждого запроса в полёте, и параллельные прогоны
          # упираются в этот резерв раньше, чем в баланс (402).
          CONCURRENCY: '1'
        run: node scripts/content/generate-drafts.mjs

      # Картинки — одним пакетом на всю месячную норму, включая черновики.
      # Без этого hero генерился бы по одной штуке в день публикации.
      - name: Hero-картинки пакетом
        if: steps.plan.outputs.skip != '1' && inputs.dry_run != '1' && inputs.skip_images != '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INCLUDE_DRAFTS: '1'
          LIMIT: '0'
        run: node scripts/generate-hero-images.mjs

      - name: WebP-версии
        if: steps.plan.outputs.skip != '1' && inputs.dry_run != '1' && inputs.skip_images != '1'
        run: node scripts/optimize-images.mjs

      # Шаги ниже намеренно не привязаны к успеху генерации: если прогон
      # оборвался на середине (кончились кредиты, отвалилась модель), уже
      # написанные статьи должны доехать до репозитория.
      - name: Сборка со страховкой
        id: build
        if: steps.plan.outputs.skip != '1' && inputs.dry_run != '1'
        run: node scripts/content/build-guard.mjs --attempts=3

      - name: Коммит и пуш
        if: steps.plan.outputs.skip != '1' && inputs.dry_run != '1' && steps.build.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in src/content/blog src/content/wiki public/images/hero \
                   src/data/factcheck .claude/factchecked .claude/quarantine; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && echo "Нечего коммитить." && exit 0
          COUNT=$(git diff --staged --name-only -- src/content/blog/ | wc -l)
          git commit -m "content(autopilot): черновиков — $COUNT"
          for i in 1 2 3 4; do
            git push origin main && break
            echo "Пуш не прошёл, повтор через $((2 ** i))с"; sleep $((2 ** i))
            git pull --rebase origin main || true
          done

      - name: Итог прогона
        if: always()
        run: |
          {
            echo "## Автопилот контента"
            echo ''
            node scripts/content/queue-status.mjs || true
          } >> $GITHUB_STEP_SUMMARY
