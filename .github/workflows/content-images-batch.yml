name: Картинки — пакетный прогон

# Единственное, на что автопилот тратит OPENROUTER_API_KEY, — изображения.
# Статьи пишет Claude (Routine на claude.ai/code), см. docs/autopilot.md.
#
# Прогон идёт разом по всем черновикам без hero: закоммитил месячную норму
# статей — одним запуском получил месячную норму картинок.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Перерисовать даже там, где hero уже есть (1 = да)'
        required: false
        default: '0'
      limit:
        description: 'Не больше N картинок за прогон (0 = без лимита)'
        required: false
        default: '0'

concurrency:
  group: content-images-batch
  cancel-in-progress: false

jobs:
  images:
    # Свой же коммит с картинками не должен запускать прогон заново.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Hero-картинки пакетом (включая черновики)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INCLUDE_DRAFTS: '1'
          LIMIT: ${{ inputs.limit || '0' }}
          FORCE: ${{ inputs.force || '0' }}
        run: node scripts/generate-hero-images.mjs

      - name: WebP-версии
        run: node scripts/optimize-images.mjs

      - name: Коммит и пуш
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in src/content/blog public/images/hero; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && echo "Нечего коммитить." && exit 0
          COUNT=$(git diff --staged --name-only -- public/images/hero/ | wc -l)
          git commit -m "chore(images): hero-картинки — $COUNT файлов"
          for i in 1 2 3 4; do
            git push origin main && break
            echo "Пуш не прошёл, повтор через $((2 ** i))с"; sleep $((2 ** i))
            git pull --rebase origin main || true
          done
