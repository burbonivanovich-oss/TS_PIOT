name: Коммерческая аналитика — чтение Метрики

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/analytics/fetch-commercial.mjs
      - scripts/analytics/lib/commercial-metrika.mjs
      - .github/workflows/commercial-analytics.yml

permissions:
  contents: read

concurrency:
  group: commercial-analytics-read
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read own counter and seven goals
        env:
          METRIKA_OAUTH_TOKEN: ${{ secrets.METRIKA_OAUTH_TOKEN }}
          COMMERCIAL_OUTPUT: ${{ runner.temp }}/commercial/analytics/export.json
          COMMERCIAL_DAYS: '7'
        run: node scripts/analytics/fetch-commercial.mjs
      - name: Save aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrika-commercial-7-days
          path: ${{ runner.temp }}/commercial/
          if-no-files-found: error
          retention-days: 3
