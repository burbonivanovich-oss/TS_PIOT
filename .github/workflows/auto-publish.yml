name: Публикация — диагностика прежней очереди

# Единственный владелец выпуска — daily.mjs в одной рутине auto-day.
# Прежний cron мог выпускать чужие черновики сверх месячной нормы.
# Этот workflow оставлен только для чтения очереди, без изменения файлов.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Прежняя очередь — только чтение
        run: node scripts/content/queue-status.mjs --json
